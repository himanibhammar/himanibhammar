<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="Fun fact: I run on two power modes. Low-power: exploring a new café with headphones on and zero urgency. Full send: something interesting to test, break or organize appears and I disappear into it until it works. Trigger: curiosity. Side effects: hackathons.">
  <title>Fun fact: two power modes</title>
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DCEBFF"/><stop offset="1" stop-color="#C5E3F6"/></linearGradient>
    <linearGradient id="bat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B8B8F5"/><stop offset="1" stop-color="#6F7BE0"/></linearGradient>
  </defs>
  <rect width="900" height="270" rx="26" fill="url(#f)"/>
  <rect x=".75" y=".75" width="898.5" height="268.5" rx="25.5" fill="none" stroke="#B8B8F5" stroke-width="1.5"/>
  <g transform="translate(24 40) scale(.85)">
  <defs>
    <linearGradient id="ffg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4F2FC"/><stop offset="1" stop-color="#C5E3F6"/>
    </linearGradient>
  </defs>
  <ellipse cx="106" cy="146" rx="56" ry="6" fill="#243B64" opacity=".12">
    <animate attributeName="rx" values="56;48;56" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".12;.07;.12" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" keyTimes="0;.5;1"/>
    <circle cx="62" cy="88" r="34" fill="#8FBCE3" stroke="#8FBCE3" stroke-width="7"/><circle cx="102" cy="62" r="46" fill="#8FBCE3" stroke="#8FBCE3" stroke-width="7"/><circle cx="146" cy="84" r="36" fill="#8FBCE3" stroke="#8FBCE3" stroke-width="7"/><rect x="30" y="86" width="152" height="42" rx="21" fill="#8FBCE3" stroke="#8FBCE3" stroke-width="7"/>
    <circle cx="62" cy="88" r="34" fill="url(#ffg)"/><circle cx="102" cy="62" r="46" fill="url(#ffg)"/><circle cx="146" cy="84" r="36" fill="url(#ffg)"/><rect x="30" y="86" width="152" height="42" rx="21" fill="url(#ffg)"/>
    <path d="M78 52 Q92 40 110 42" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity=".8"/>
    <ellipse cx="86" cy="98" rx="5" ry="6.2" fill="#243B64"/><ellipse cx="124" cy="98" rx="5" ry="6.2" fill="#243B64"/>
    <circle cx="88" cy="95.5" r="1.8" fill="#FFFFFF"/><circle cx="126" cy="95.5" r="1.8" fill="#FFFFFF"/>
    <ellipse cx="72" cy="110" rx="8" ry="5" fill="#B8B8F5" opacity=".7"/><ellipse cx="138" cy="110" rx="8" ry="5" fill="#B8B8F5" opacity=".7"/>
    <path d="M97 108 Q105 117 113 108" stroke="#243B64" stroke-width="3" stroke-linecap="round" fill="none"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="2.2s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(30 40)"><path d="M0,-9 Q0,0 9,0 Q0,0 0,9 Q0,0 -9,0 Q0,0 0,-9Z" fill="#FFFFFF" stroke="#8FBCE3" stroke-width="0.8"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" begin="0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.7;1.15;0.7" dur="2.6s" begin="0s" repeatCount="indefinite"/></path></g>
  <g transform="translate(176 30)"><path d="M0,-7 Q0,0 7,0 Q0,0 0,7 Q0,0 -7,0 Q0,0 0,-7Z" fill="#FFFFFF" stroke="#8FBCE3" stroke-width="0.8"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" begin="0.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.7;1.15;0.7" dur="3.2s" begin="0.6s" repeatCount="indefinite"/></path></g>
  <g transform="translate(190 96)"><path d="M0,-6 Q0,0 6,0 Q0,0 0,6 Q0,0 -6,0 Q0,0 0,-6Z" fill="#FFFFFF" stroke="#8FBCE3" stroke-width="0.8"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.9s" begin="1.1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.7;1.15;0.7" dur="2.9s" begin="1.1s" repeatCount="indefinite"/></path></g>
  <g transform="translate(18 92)"><polygon points="0.00,-8.00 2.12,-2.91 7.61,-2.47 3.42,1.11 4.70,6.47 0.00,3.60 -4.70,6.47 -3.42,1.11 -7.61,-2.47 -2.12,-2.91" fill="#B8B8F5" stroke="#FFFFFF" stroke-width="0.8" stroke-linejoin="round"><animate attributeName="opacity" values="0.55;1;0.55" dur="3.4s" begin="0.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="-10;10;-10" dur="5.1s" begin="0.2s" repeatCount="indefinite"/></polygon></g>
  <g transform="translate(160 8)"><polygon points="0.00,-7.00 1.85,-2.55 6.66,-2.16 3.00,0.97 4.11,5.66 0.00,3.15 -4.11,5.66 -3.00,0.97 -6.66,-2.16 -1.85,-2.55" fill="#B8B8F5" stroke="#FFFFFF" stroke-width="0.8" stroke-linejoin="round"><animate attributeName="opacity" values="0.55;1;0.55" dur="3.8s" begin="0.9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="-10;10;-10" dur="5.699999999999999s" begin="0.9s" repeatCount="indefinite"/></polygon></g>
  <g transform="translate(48 14)"><polygon points="0.00,-5.00 1.32,-1.82 4.76,-1.55 2.14,0.70 2.94,4.05 0.00,2.25 -2.94,4.05 -2.14,0.70 -4.76,-1.55 -1.32,-1.82" fill="#B8B8F5" stroke="#FFFFFF" stroke-width="0.8" stroke-linejoin="round"><animate attributeName="opacity" values="0.55;1;0.55" dur="3.0s" begin="1.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="-10;10;-10" dur="4.5s" begin="1.4s" repeatCount="indefinite"/></polygon></g>
</g>
  <text x="250" y="52" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#4A6290">$ ./brain.sh --mode=auto</text>
  <text x="250" y="96" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" fill="#243B64" textLength="420" lengthAdjust="spacing">I run on two power modes.</text>

  <!-- battery -->
  <g transform="translate(250 118)">
    <rect width="190" height="36" rx="10" fill="#FFFFFF" stroke="#243B64" stroke-width="2.5"/>
    <rect x="194" y="10" width="7" height="16" rx="3" fill="#243B64"/>
    <rect x="5" y="5" width="0" height="26" rx="6" fill="url(#bat)">
      <animate attributeName="width" dur="14.0s" repeatCount="indefinite" keyTimes="0;.02;.40;.52;.60;.95;1" values="26;26;26;26;180;180;26" calcMode="linear"/>
    </rect>
  </g>
  <!-- state A -->
  <g><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.0000;0.0357;0.4214;0.4571;1" values="0;0;1;1;0;0"/>
    <text x="460" y="143" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="18" font-weight="700" fill="#243B64">mode: low-power</text>
    <text x="250" y="192" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#243B64">A new café, headphones on, zero urgency.</text>
    <text x="250" y="218" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#243B64">Ask me to do something boring and I will, eventually.</text>
  </g>
  <!-- trigger -->
  <g><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.4143;0.4500;0.5643;0.6000;1" values="0;0;1;1;0;0"/>
    <text x="460" y="143" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="18" font-weight="700" fill="#6F7BE0">interesting task detected…</text>
    <text x="250" y="192" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#243B64">Something new to test, break or organize shows up.</text>
  </g>
  <!-- state B -->
  <g><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.5714;0.6071;0.9500;0.9857;1" values="0;0;1;1;0;0"/>
    <text x="460" y="143" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="18" font-weight="700" fill="#243B64">mode: full send</text>
    <text x="250" y="192" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#243B64">Then I disappear into it until it works.</text>
    <text x="250" y="218" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#243B64">Hackathon energy: build, test, break, fix, repeat.</text>
  </g>
  <text x="250" y="252" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13.5" fill="#4A6290">trigger: curiosity · side effects: hackathons</text>
  <g transform="translate(840 40)"><path d="M0,-9 Q0,0 9,0 Q0,0 0,9 Q0,0 -9,0 Q0,0 0,-9Z" fill="#FFFFFF"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.7s" begin="0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.7;1.15;0.7" dur="2.7s" begin="0s" repeatCount="indefinite"/></path></g><g transform="translate(868 90)"><polygon points="0.00,-8.00 2.12,-2.91 7.61,-2.47 3.42,1.11 4.70,6.47 0.00,3.60 -4.70,6.47 -3.42,1.11 -7.61,-2.47 -2.12,-2.91" fill="#6F7BE0" stroke="#FFFFFF" stroke-width="0.8" stroke-linejoin="round"><animate attributeName="opacity" values="0.55;1;0.55" dur="3.4s" begin="0.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="-10;10;-10" dur="5.1s" begin="0.5s" repeatCount="indefinite"/></polygon></g><g transform="translate(806 232)"><path d="M0,-7 Q0,0 7,0 Q0,0 0,7 Q0,0 -7,0 Q0,0 0,-7Z" fill="#FFFFFF"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.1s" begin="1.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.7;1.15;0.7" dur="3.1s" begin="1.0s" repeatCount="indefinite"/></path></g>
</svg>
