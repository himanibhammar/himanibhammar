ution, verification and repair</text><text x="44" y="180" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#243B64" >work as one pipeline.</text><rect x="44" y="210" width="68" height="28" rx="14" fill="#fff" fill-opacity=".8" stroke="#B8B8F5" stroke-width="1.5"/><text x="78.06" y="229" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#243B64" text-anchor="middle">Python</text><rect x="122.12" y="210" width="47" height="28" rx="14" fill="#fff" fill-opacity=".8" stroke="#B8B8F5" stroke-width="1.5"/><text x="145.65" y="229" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#243B64" text-anchor="middle">RAG</text><rect x="179.18" y="210" width="54" height="28" rx="14" fill="#fff" fill-opacity=".8" stroke="#B8B8F5" stroke-width="1.5"/><text x="206.22" y="229" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#243B64" text-anchor="middle">LLMs</text><rect x="243.26" y="210" width="159" height="28" rx="14" fill="#fff" fill-opacity=".8" stroke="#B8B8F5" stroke-width="1.5"/><text x="322.95" y="229" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#243B64" text-anchor="middle">Sandboxed execution</text><rect x="412.64" y="210" width="138" height="28" rx="14" fill="#fff" fill-opacity=".8" stroke="#B8B8F5" stroke-width="1.5"/><text x="481.79999999999995" y="229" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#243B64" text-anchor="middle">Automated repair</text>
