<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="960" height="210" role="img" aria-labelledby="t d"><title id="t">Fun facts, told by the cloud</title>
<desc id="d">Idle until something interesting shows up. Then I'm locked in and hard to pull away. Hackathon podiums as a participant, hackathons as an organizer. I've seen both sides of the leaderboard. Two AWS certifications (Cloud Practitioner and AI Practitioner), so I can explain the cloud as more than someone else's computer. I can't leave things untested. I'll break them just to see how they work. Usually experimenting with technology or looking for my next café.</desc>
