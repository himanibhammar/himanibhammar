<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" width="960" height="290" role="img" aria-labelledby="t d"><title id="t">Fun facts</title>
<desc id="d">Idle until something interesting shows up. Then: locked in. Podiums as a participant. Hackathons as an organizer. Two AWS certs. I can explain the cloud beyond someone else's computer. Can't leave things untested. Will break them just to see how they work. Usually experimenting with technology or looking for my next café.</desc>
