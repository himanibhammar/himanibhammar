<linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBFF"/><stop offset=".6" stop-color="#C5E3F6"/><stop offset="1" stop-color="#B8B8F5"/></linearGradient>
