<rect width="880" height="510" rx="22" fill="url(#g1)"/><rect x="1" y="1" width="878" height="508" rx="21" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2"/><line x1="40" y1="30" x2="40" y2="390" stroke="#B8B8F5" stroke-width="3" stroke-linecap="round"/><circle cx="40" cy="30" r="11" fill="#B8B8F5" stroke="#fff" stroke-width="3"/><circle cx="40" cy="150" r="11" fill="#fff" stroke="#4B4BC4" stroke-width="3" stroke-dasharray="4 3"/><circle cx="40" cy="248" r="11" fill="#B8B8F5" stroke="#fff" stroke-width="3"/><circle cx="40" cy="390" r="11" fill="#B8B8F5" stroke="#fff" stroke-width="3"/><text x="80" y="35" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#243B64" >Organizer · Challenges &amp; Championships, Aaruush</text><text x="80" y="59" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#4B4BC4" >Ongoing</text><text x="80" y="84" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#243B64" >Organizing Hack Summit and the NASA Space Apps Challenge, a flagship Aaruush event.</text><text x="80" y="106" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#243B64" >I enjoy running hackathons, coordinating people and bringing technical communities together.</text><text x="80" y="155" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#243B64" >BA4 Developer · Barclays</text><text x="80" y="179" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#4B4BC4" >Upcoming</text><text x="80" y="204" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#243B64" >Joining as a BA4 Developer.</text><text x="80" y="253" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#243B64" >Technology Developer Intern · Barclays</text><text x="80" y="277" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#4B4BC4" >June 2026 – August 2026</text><text x="80" y="302" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#243B64" >Built a business development initiative to demo and pitch partner-onboarding journeys.</text><text x="80" y="324" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#243B64" >Used Playwright to automate browser interactions and simulate user workflows, and contributed to</text><text x="80" y="346" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#243B64" >application development, automation and testing.</text><text x="80" y="395" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#243B64" >R&amp;D Intern · Samsung PRISM</text><text x="80" y="419" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#4B4BC4" >March 2025 – February 2026</text><text x="80" y="444" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#243B64" >Developed a RAG-based system that turns natural-language requests into optimized SQL queries across</text><text x="80" y="466" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#243B64" >MySQL, PostgreSQL and SQLite, using query generation and optimization techniques.</text><path d="M0,-10 Q0,0 10,0 Q0,0 0,10 Q0,0 -10,0 Q0,0 0,-10Z" transform="translate(845,34) scale(1.2)" fill="#fff"><animate attributeName="opacity" values="1;.3;1" dur="3s" begin="0s" repeatCount="indefinite"/></path><polygon points="0,-9 2.6,-2.8 9,-2.8 3.9,1.6 5.8,8 0,4.2 -5.8,8 -3.9,1.6 -9,-2.8 -2.6,-2.8" transform="translate(815,26) scale(0.8)" fill="#B8B8F5"><animate attributeName="opacity" values="1;.4;1" dur="2.9s" begin="0.3s" repeatCount="indefinite"/></polygon>
</svg>
