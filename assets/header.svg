<text x="640" y="116" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" xml:space="preserve"><tspan fill="#6E7F96"># simplified from my code-gen platform</tspan></text><text x="640" y="142" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" xml:space="preserve"><tspan fill="#FF7B72">while</tspan><tspan fill="#C9D1D9"> </tspan><tspan fill="#FF7B72">not</tspan><tspan fill="#C9D1D9"> </tspan><tspan fill="#C9D1D9">verified</tspan><tspan fill="#C9D1D9">:</tspan></text><text x="640" y="168" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" xml:space="preserve"><tspan fill="#C9D1D9">    </tspan><tspan fill="#C9D1D9">code</tspan><tspan fill="#C9D1D9"> = </tspan><tspan fill="#D2A8FF">generate</tspan><tspan fill="#C9D1D9">(</tspan><tspan fill="#C9D1D9">task</tspan><tspan fill="#C9D1D9">, </tspan><tspan fill="#C9D1D9">context</tspan><tspan fill="#C9D1D9">)</tspan></text><text x="640" y="194" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" xml:space="preserve"><tspan fill="#C9D1D9">    </tspan><tspan fill="#C9D1D9">result</tspan><tspan fill="#C9D1D9"> = </tspan><tspan fill="#C9D1D9">sandbox</tspan><tspan fill="#C9D1D9">.</tspan><tspan fill="#D2A8FF">run</tspan><tspan fill="#C9D1D9">(</tspan><tspan fill="#C9D1D9">code</tspan><tspan fill="#C9D1D9">)</tspan></text><text x="640" y="220" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" xml:space="preserve"><tspan fill="#C9D1D9">    </tspan><tspan fill="#C9D1D9">verified</tspan><tspan fill="#C9D1D9">, </tspan><tspan fill="#C9D1D9">evidence</tspan><tspan fill="#C9D1D9"> = </tspan><tspan fill="#D2A8FF">verify</tspan><tspan fill="#C9D1D9">(</tspan><tspan fill="#C9D1D9">result</tspan><tspan fill="#C9D1D9">)</tspan></text><text x="640" y="246" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" xml:space="preserve"><tspan fill="#C9D1D9">    </tspan><tspan fill="#C9D1D9">context</tspan><tspan fill="#C9D1D9"> = </tspan><tspan fill="#D2A8FF">repair</tspan><tspan fill="#C9D1D9">(</tspan><tspan fill="#C9D1D9">code</tspan><tspan fill="#C9D1D9">, </tspan><tspan fill="#C9D1D9">evidence</tspan><tspan fill="#C9D1D9">)</tspan></text><rect x="916.5999999999999" y="234" width="7" height="15" fill="#4C8DFF"><animate attributeName="opacity" values="1;0" calcMode="discrete" keyTimes="0;.5" dur="1s" repeatCount="indefinite"/></rect>
